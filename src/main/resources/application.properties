# CRON
## Use unix cron instead of qwartz
quarkus.scheduler.cron-type=unix
## Every minutes
swarm.agent.cron=* * * * *

# Logs
quarkus.log.level=INFO
quarkus.log.min-level=INFO

%dev.quarkus.kubernetes-client.devservices.enabled=false
%dev.quarkus.kubernetes-client.api-server-url=https://fvd0tx.c1.gra11.k8s.ovh.net
%dev.quarkus.kubernetes-client.username=kubernetes-admin-swarm-dev
%dev.quarkus.kubernetes-client.client-cert-
%dev.quarkus.kubernetes-client.client-key-
%dev.quarkus.kubernetes-client.ca-cert-

# Cluster configuration
swarm.agent.public.service.hostname=swarm.support-ent.fr
swarm.agent.prestashop.email.hostname=support-ent.fr
swarm.agent.wordpress.email.hostname=support-ent.fr
swarm.agent.kubernetes.namespace=services
swarm.agent.kubernetes.ingress.name=swarm-ingress
swarm.agent.kubernetes.ingress.class.name=nginx
swarm.agent.kubernetes.tls.secret.name=swarm-tls-secret
swarm.agent.kubernetes.cluster.ip=57.128.87.84

# Database configuration

# Hibernate
quarkus.hibernate-orm.enabled = true
quarkus.datasource.db-kind = postgresql

%dev.quarkus.datasource.username = quarkus
%dev.quarkus.datasource.password = quarkus
%dev.quarkus.hibernate-orm.database.generation=create-drop
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.sql-load-script=dev.sql

# Kubernetes
quarkus.kubernetes-client.devservices.enabled=false
quarkus.container-image.registry=nexus-pic2.support-ent.fr
quarkus.container-image.group=app-swarm
quarkus.kubernetes.namespace=swarm

## RBAC Role
quarkus.kubernetes.rbac.cluster-roles.swarm-agent-role.policy-rules.0.api-groups=
quarkus.kubernetes.rbac.cluster-roles.swarm-agent-role.policy-rules.0.resources=secrets
quarkus.kubernetes.rbac.cluster-roles.swarm-agent-role.policy-rules.0.verbs=get,create,update,patch,delete,watch

quarkus.kubernetes.rbac.cluster-roles.swarm-agent-role.policy-rules.1.api-groups=fr.cgi.learninghub.swarm
quarkus.kubernetes.rbac.cluster-roles.swarm-agent-role.policy-rules.1.resources=wordpresses
quarkus.kubernetes.rbac.cluster-roles.swarm-agent-role.policy-rules.1.verbs=get,create,update,patch,delete,watch

quarkus.kubernetes.rbac.cluster-roles.swarm-agent-role.policy-rules.2.api-groups=fr.cgi.learninghub.swarm
quarkus.kubernetes.rbac.cluster-roles.swarm-agent-role.policy-rules.2.resources=prestashops
quarkus.kubernetes.rbac.cluster-roles.swarm-agent-role.policy-rules.2.verbs=get,create,update,patch,delete,watch

quarkus.kubernetes.rbac.cluster-roles.swarm-agent-role.policy-rules.3.api-groups=networking.k8s.io
quarkus.kubernetes.rbac.cluster-roles.swarm-agent-role.policy-rules.3.resources=ingresses
quarkus.kubernetes.rbac.cluster-roles.swarm-agent-role.policy-rules.3.verbs=get,create,update,patch,delete,watch

quarkus.kubernetes.rbac.cluster-roles.swarm-agent-role.policy-rules.4.api-groups=
quarkus.kubernetes.rbac.cluster-roles.swarm-agent-role.policy-rules.4.resources=pods
quarkus.kubernetes.rbac.cluster-roles.swarm-agent-role.policy-rules.4.verbs=get,watch,list

quarkus.kubernetes.rbac.service-accounts.swarm-agent-service-account.namespace=swarm

## Registry
quarkus.kubernetes.generate-image-pull-secret=true

## Ingress
quarkus.kubernetes.ingress.expose=false

## Config
quarkus.kubernetes.env.secrets=api-postgres-secret
quarkus.kubernetes.env.configmaps=api-postgres-config,swarm-agent-config-env
quarkus.kubernetes.app-config-map=swarm-agent-configs